name: Build and Publish Ring-MQTT LightFix Docker Image

on:
  push:
    branches:
      - lightfix

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Version From VERSION File
        run: |
          echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_ENV

      - name: Sync Package Versions For Build
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['package.json', 'package-lock.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = process.env.VERSION;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
          "

      - name: Set Docker Image Name
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository }}" >> $GITHUB_ENV
    
      - name: Show Build Information
        run: |
          echo "Image: $IMAGE"
          echo "Version: $VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            BUILD_VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Checkout add-on repository
        uses: actions/checkout@v4
        with:
          repository: terrastak/ring-mqtt-ha-addon
          ref: lightfix
          token: ${{ secrets.ADDON_REPO_TOKEN }}
          path: ring-mqtt-ha-addon

      - name: Update add-on version
        working-directory: ring-mqtt-ha-addon
        run: |
          sed -i "s/^version:.*/version: $VERSION/" config.yaml
          if ! git diff --quiet -- config.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config.yaml
            git commit -m "Update add-on to $VERSION"
            git push
          fi
